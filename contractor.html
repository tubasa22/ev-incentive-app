<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린EV 컨트랙터 포털</title><style>body{font:15px system-ui,"Malgun Gothic";max-width:900px;margin:30px auto;padding:0 18px}input,select,button{padding:9px;margin:5px}section{margin:16px 0;padding:16px;border:1px solid #ccc}.hidden{display:none}.error{color:#b00}</style><body><h1>컨트랙터 포털</h1><section id="login"><input id="id" placeholder="컨트랙터 ID"><input id="code" placeholder="액세스코드"><button id="loginBtn">로그인</button><p id="msg"></p></section><main id="app" class="hidden"><button data-tab="cases">내 배정 건</button><button data-tab="agreement">계약 관리</button><section id="cases"><h2>내 배정 건</h2><div id="caseList"></div></section><section id="agreement" class="hidden"><h2>계약 관리</h2><div id="agreementInfo"></div></section></main><script>const CONFIG={apiUrl:''};let contractorId,accessCode;const $=s=>document.querySelector(s);async function api(action,p={}){let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...p,action})}),j=await r.json();if(!j.success)throw Error(j.error||'요청에 실패했습니다.');return j}$('#loginBtn').onclick=async()=>{try{contractorId=$('#id').value;accessCode=$('#code').value;await api('contractorLogin',{contractorId,accessCode});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadCases();loadAgreement()}catch(e){$('#msg').className='error';$('#msg').textContent=e.message}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.tab).classList.remove('hidden')});async function loadCases(){let r=await api('getMyCases',{contractorId,accessCode});$('#caseList').innerHTML=r.cases.map(c=>`<div><b>${c.caseId}</b> · ${c.name} · ${c.phone} · ${c.status}<br>작업: ${c.workDetails.purchaseType} ${c.workDetails.desiredVehicle}<select id="s-${c.caseId}"><option>방문예정</option><option>시공중</option><option>시공완료</option><option>서류제출완료</option></select><button onclick="updateCase('${c.caseId}')">상태 저장</button></div>`).join('')||'배정된 건이 없습니다.'}async function updateCase(id){try{await api('updateMyCaseStatus',{caseId:id,contractorId,accessCode,newStatus:$('#s-'+id).value,note:''});loadCases()}catch(e){alert(e.message)}}async function loadAgreement(){let r=await api('getAgreementStatus',{contractorId,accessCode});$('#agreementInfo').innerHTML=r.agreement.completed?`계약서 제출 완료<br>라이선스: ${r.agreement.licenseNumber}<br>본드: ${r.agreement.bondNumber}<p>계약서는 재작성할 수 없습니다.</p>`:`<p>계약서가 아직 제출되지 않았습니다.</p><a href="contract.html?contractorId=${encodeURIComponent(contractorId)}">계약서 작성하기</a>`}</script></body></html>
