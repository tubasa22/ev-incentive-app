<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린EV 컨트랙터 포털</title><style>body{font:15px system-ui,"Malgun Gothic";max-width:900px;margin:30px auto;padding:0 18px}input,select,button{padding:9px;margin:5px}section{margin:16px 0;padding:16px;border:1px solid #ccc}.hidden{display:none}.error{color:#b00}.history{margin-top:10px;padding-top:8px;border-top:1px solid #ddd}.history ul{margin:5px 0 0;padding-left:20px}.history li{margin:3px 0;color:#444}</style><body><h1>컨트랙터 포털</h1><section id="login"><input id="id" placeholder="컨트랙터 ID"><input id="code" placeholder="액세스코드"><button id="loginBtn">로그인</button><p id="msg"></p></section><main id="app" class="hidden"><button data-tab="cases">내 배정 건</button><button data-tab="agreement">계약 관리</button><section id="cases"><h2>내 배정 건</h2><div id="caseList"></div></section><section id="agreement" class="hidden"><h2>계약 관리</h2><div id="agreementInfo"></div></section></main><!-- site-config.js의 apiUrl을 실제 배포 URL로 채워야 동작함. GitHub Pages 등 웹서버에서 테스트하세요. --><script src="site-config.js"></script><script>const CONFIG={apiUrl:SITE_CONFIG.apiUrl};let contractorId,accessCode;const $=s=>document.querySelector(s);async function api(action,p={}){let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...p,action})}),j=await r.json();if(!j.success)throw Error(j.error||'요청에 실패했습니다.');return j}$('#loginBtn').onclick=async()=>{try{contractorId=$('#id').value;accessCode=$('#code').value;await api('contractorLogin',{contractorId,accessCode});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadCases();loadAgreement()}catch(e){$('#msg').className='error';$('#msg').textContent=e.message}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.tab).classList.remove('hidden')});function renderHistory(history){let items=(history||[]).map(h=>`<li>${h.newStatus} - ${h.timestamp}</li>`).join('');return `<div class="history"><b>진행 이력</b>${items?`<ul>${items}</ul>`:'<p>아직 기록된 진행 이력이 없습니다.</p>'}</div>`;}async function loadCases(){let r=await api('getMyCases',{contractorId,accessCode});$('#caseList').innerHTML=r.cases.map(c=>`<div><b>${c.caseId}</b> · ${c.name} · ${c.phone} · ${c.status}<br>작업: ${c.workDetails.purchaseType} ${c.workDetails.desiredVehicle}${renderHistory(c.history)}<select id="s-${c.caseId}"><option>방문예정</option><option>시공중</option><option>시공완료</option><option>서류제출완료</option></select><button onclick="updateCase('${c.caseId}')">상태 저장</button></div>`).join('')||'배정된 건이 없습니다.'}async function updateCase(id){try{await api('updateMyCaseStatus',{caseId:id,contractorId,accessCode,newStatus:$('#s-'+id).value,note:''});await loadCases()}catch(e){alert(e.message)}}async function loadAgreement(){let r=await api('getAgreementStatus',{contractorId,accessCode});$('#agreementInfo').innerHTML=r.agreement.completed?`계약서 제출 완료<br>라이선스: ${r.agreement.licenseNumber}<br>본드: ${r.agreement.bondNumber}<p>계약서는 재작성할 수 없습니다.</p>`:`<p>계약서가 아직 제출되지 않았습니다.</p><a href="contract.html?contractorId=${encodeURIComponent(contractorId)}">계약서 작성하기</a>`}
let ladwpSteps=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ladwpChecklist(c){if(!c.isLadwpInstall)return '';let multi=c.address?.residenceType==='다세대주택';return '<section class="ladwp-steps"><h3>LADWP 설치 절차</h3><p><strong>8단계 중 '+Number(c.ladwpStep||0)+'단계 진행중</strong></p><p class="error"><strong>순서 중요:</strong> 온라인 신청서(4단계)는 전기허가·시공(6단계) 전에 반드시 완료해야 지연을 방지할 수 있습니다.</p>'+ladwpSteps.map(s=>'<label style="display:block;margin:12px 0;padding:10px;border:1px solid #ddd"><input type="checkbox" class="ladwpStep" data-case="'+esc(c.caseId)+'" data-step="'+s.step+'" '+(s.step<=c.ladwpStep?'checked disabled':s.step===c.ladwpStep+1?'':'disabled')+'> <strong>'+s.step+'. '+esc(s.title)+'</strong><br><small>'+esc(s.desc)+'</small>'+(multi?'<br><span style="display:inline-block;margin-top:6px;padding:3px 7px;background:#fff3cd">다세대주택 참고</span> <small>전기 설계도면이 필요할 수 있어 더 오래 걸릴 수 있습니다.</small>':'')+'</label>').join('')+'</section>'}loadCases=async function(){if(!ladwpSteps.length)ladwpSteps=(await api('getLadwpSteps')).steps;let r=await api('getMyCases',{contractorId,accessCode});$('#caseList').innerHTML=r.cases.map(c=>'<article><b>'+esc(c.caseId)+'</b> · '+esc(c.name)+' · '+esc(c.phone)+' · '+esc(c.status)+'<br>작업: '+esc(c.workDetails.purchaseType)+' '+esc(c.workDetails.desiredVehicle)+renderHistory(c.history)+ladwpChecklist(c)+'<select id="s-'+esc(c.caseId)+'"><option>방문예정</option><option>시공중</option><option>시공완료</option><option>서류제출완료</option></select><button onclick="updateCase(\''+esc(c.caseId)+'\')">상태 저장</button></article>').join('')||'배정된 건이 없습니다.';document.querySelectorAll('.ladwpStep').forEach(box=>box.onchange=async()=>{if(!box.checked)return;box.disabled=true;try{await api('updateLadwpStep',{caseId:box.dataset.case,contractorId,accessCode,stepNumber:Number(box.dataset.step)});await loadCases()}catch(e){box.checked=false;box.disabled=false;alert(e.message)}})};
/* 공통 API 연결: site-config.js의 apiUrl을 설정한 웹서버 환경에서만 동작합니다. */
const __cleanEvFetch=window.fetch.bind(window);window.fetch=async function(){if(!window.SITE_CONFIG||SITE_CONFIG.apiUrl==='PASTE_YOUR_APPS_SCRIPT_URL_HERE'||!SITE_CONFIG.apiUrl)throw Error('관리자가 아직 서버 설정을 완료하지 않았습니다');try{return await __cleanEvFetch.apply(null,arguments)}catch(e){throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요')}};CONFIG.apiUrl=SITE_CONFIG.apiUrl;
</script></body></html>
