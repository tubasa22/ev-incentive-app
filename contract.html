<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린EV 계약서</title><style>body{font:15px system-ui,"Malgun Gothic";max-width:800px;margin:30px auto;padding:0 18px}input,button{width:100%;padding:9px;margin:5px 0}section{padding:16px;border:1px solid #ccc;margin:12px 0}.hidden{display:none}.terms{height:180px;overflow:auto;white-space:pre-line}.error{color:#b00}</style><body><h1>컨트랙터 계약서</h1><section id="auth"><input id="code" placeholder="액세스코드 재입력"><button id="start">계속</button><p id="msg"></p></section><section id="otp" class="hidden"><button id="send">인증번호 받기</button><input id="otpCode" placeholder="6자리 인증번호"><button id="verify">인증 확인</button><p id="otpMsg"></p></section><form id="form" class="hidden"><section><h2>사업자 정보</h2><input name="businessName" placeholder="상호명" required><input name="businessNumber" placeholder="사업자등록번호"><input name="manager" placeholder="담당자명"><input name="phone" placeholder="연락처" required></section><section><h2>라이선스 정보</h2><p>캘리포니아 계약자 면허(CSLB) 번호를 입력하세요.</p><input name="licenseNumber" placeholder="라이선스번호" required><input name="licenseType" placeholder="라이선스종류"><input name="licenseExpiry" type="date" required></section><section><h2>본드 정보</h2><input name="bondCompany" placeholder="본드회사명"><input name="bondNumber" placeholder="본드번호" required><input name="bondAmount" placeholder="본드보장금액"><input name="bondExpiry" type="date" required></section><section class="terms" id="terms"><!-- TODO: 실제 법적 효력이 필요한 계약서이므로 변호사 검토 후 이 조항들을 교체할 것 — 특히 독립계약자 지위(AB5/ABC 테스트) 관련 조항은 캘리포니아 노동법 전문가 확인 필수 -->
1) 본인은 독립계약자로서 업무를 수행합니다.
2) 라이선스와 본드를 유효하게 유지할 의무가 있습니다.
3) 관련 법령 준수와 시공 품질에 대한 책임이 있습니다.
4) 본인의 과실로 인한 손해를 면책 및 배상합니다.
5) 적절한 보험 가입을 권장합니다.
6) 중대한 계약 위반 시 계약을 해지할 수 있습니다.</section><label><input id="agree" type="checkbox" disabled> 계약서 조항에 동의합니다.</label><input name="signature" placeholder="전자서명: 본인 이름 입력" required><button>동의하고 제출</button></form><section id="done" class="hidden">계약서가 제출되었습니다. 관리자 확인 후 안내드립니다.</section><!-- site-config.js의 apiUrl을 실제 배포 URL로 채워야 동작함. GitHub Pages 등 웹서버에서 테스트하세요. --><script src="site-config.js"></script><script>const CONFIG={apiUrl:SITE_CONFIG.apiUrl};const contractorId=new URLSearchParams(location.search).get('contractorId');let accessCode='',sms=false;const $=s=>document.querySelector(s);async function api(action,p={}){let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...p,action})}),j=await r.json();if(!j.success)throw Error(j.error||'요청 실패');return j}$('#start').onclick=async()=>{try{accessCode=$('#code').value;await api('contractorLogin',{contractorId,accessCode});let r=await api('sendOTP',{contractorId,accessCode});sms=!r.smsDisabled;$('#auth').classList.add('hidden');if(sms)$('#otp').classList.remove('hidden');else{alert('지금은 SMS 인증이 비활성화되어 있습니다. 관리자가 이후 전화로 본인 확인 후 계약을 승인 처리합니다');$('#form').classList.remove('hidden')}}catch(e){$('#msg').textContent=e.message}};let cooldown=0;$('#send').onclick=async()=>{try{await api('sendOTP',{contractorId,accessCode});$('#send').disabled=true;cooldown=60;let t=setInterval(()=>{$('#send').textContent='재발송 '+cooldown+'초';if(--cooldown<0){clearInterval(t);$('#send').disabled=false;$('#send').textContent='인증번호 재발송'}},1000)}catch(e){$('#otpMsg').textContent='인증번호 발송에 실패했습니다. 잠시 후 다시 시도해주세요'}};$('#verify').onclick=async()=>{try{await api('verifyOTP',{contractorId,accessCode,inputCode:$('#otpCode').value});$('#otp').classList.add('hidden');$('#form').classList.remove('hidden')}catch(e){$('#otpMsg').textContent=e.message}};$('#terms').onscroll=()=>{let x=$('#terms');if(x.scrollTop+x.clientHeight>=x.scrollHeight-3)$('#agree').disabled=false};$('#form').onsubmit=async e=>{e.preventDefault();if(!$('#agree').checked)return alert('계약서 조항에 동의해주세요.');try{let data=Object.fromEntries(new FormData(e.target));data.agreed=true;await api('submitAgreement',{contractorId,accessCode,data});$('#form').classList.add('hidden');$('#done').classList.remove('hidden')}catch(x){alert(x.message)}};
/* 공통 API 연결: site-config.js의 apiUrl을 설정한 웹서버 환경에서만 동작합니다. */
const __cleanEvFetch=window.fetch.bind(window);window.fetch=async function(){if(!window.SITE_CONFIG||SITE_CONFIG.apiUrl==='PASTE_YOUR_APPS_SCRIPT_URL_HERE'||!SITE_CONFIG.apiUrl)throw Error('관리자가 아직 서버 설정을 완료하지 않았습니다');try{return await __cleanEvFetch.apply(null,arguments)}catch(e){throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요')}};CONFIG.apiUrl=SITE_CONFIG.apiUrl;
</script></body></html>
