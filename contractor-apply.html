<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린EV 협력업체 지원</title><script src="site-config.js"></script><style>body{font:16px system-ui,"Malgun Gothic";max-width:760px;margin:30px auto;padding:0 18px}.brand{display:inline-flex;align-items:center;margin-bottom:18px;text-decoration:none}.brand-logo{display:block;height:34px;width:auto;max-width:190px}.brand-fallback{display:none;color:#0F5C4C;font:800 22px Pretendard,system-ui,sans-serif}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 13px}label{display:block;font-weight:bold}.hidden{display:none}.error{color:#b00}</style><body><a class="brand" href="landing.html"><img class="brand-logo" src="assets/clean-ev-email-logo.png" alt="클린EV" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="brand-fallback">클린EV</span></a><h1>클린EV 협력업체 지원</h1><p>함께 고객의 전기차·충전기 지원을 도울 협력업체를 찾고 있습니다.</p><form id="form" novalidate><label>업체명 또는 이름<input name="name" placeholder="예: 김전기 일렉트릭" required></label><label>연락처<input name="phone" type="tel" inputmode="tel" pattern="[0-9-]+" placeholder="예: 714-555-1234" required></label><label>이메일<input name="email" type="email" placeholder="예: contact@example.com" required></label><label>서비스 가능 지역<input name="serviceArea" placeholder="예: 풀러턴, 애너하임, 부에나파크" required></label><h2>라이선스 정보</h2><p>캘리포니아 계약자 면허(CSLB) 번호를 입력하세요.</p><label>라이선스 번호<input name="licenseNumber" inputmode="numeric" pattern="[0-9]{3,}" placeholder="예: 1234567" required></label><label>라이선스 종류<input name="licenseType" placeholder="예: C-10 (전기)"></label><label>라이선스 만료일<input name="licenseExpiry" type="date" required></label><h2>본드 정보</h2><label>본드 회사명<input name="bondCompany" placeholder="예: Western Surety Company"></label><label>본드 번호<input name="bondNumber" placeholder="예: SB-123456" required></label><label>본드 보장금액<input name="bondAmount" type="number" min="0" step="1" placeholder="예: 15000"></label><label>본드 만료일<input name="bondExpiry" type="date" required></label><label>경력 또는 한줄소개<textarea name="bio" placeholder="예: 10년 경력의 주택용 전기 시공 전문업체입니다"></textarea></label><button>지원서 제출</button></form><section id="done" class="hidden"><h2>지원해주셔서 감사합니다.</h2><p>검토 후 이메일로 연락드리겠습니다.</p></section><p id="msg" class="error"></p><p id="warning"></p><script>const CONFIG={brandName:SITE_CONFIG.brandName||'클린EV',apiUrl:SITE_CONFIG.apiUrl};document.querySelector('h1').textContent=CONFIG.brandName+' 협력업체 지원';async function api(data){if(!CONFIG.apiUrl||CONFIG.apiUrl==='PASTE_YOUR_APPS_SCRIPT_URL_HERE')throw Error('관리자가 아직 서버 설정을 완료하지 않았습니다');try{let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}),j=await r.json();if(!j.success)throw Error(j.error||'요청에 실패했습니다.');return j}catch(e){if(e instanceof TypeError||e.message==='Failed to fetch')throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요');throw e}}const form=document.querySelector('#form'),msg=document.querySelector('#msg'),warning=document.querySelector('#warning');function dateLimits(){let today=new Date(),min=today.toISOString().slice(0,10),max=new Date(today.getFullYear()+10,today.getMonth(),today.getDate()).toISOString().slice(0,10);form.querySelectorAll('input[type=date]').forEach(x=>{x.min=min;x.max=max});return {min,max}}function validate(){let data=Object.fromEntries(new FormData(form)),errors=[],warnings=[],limits=dateLimits(),phone=String(data.phone||'').trim(),email=String(data.email||'').trim();['name','phone','email','serviceArea','licenseNumber','licenseExpiry','bondNumber','bondExpiry'].forEach(k=>{data[k]=String(data[k]||'').trim();if(!data[k])errors.push('필수 항목을 입력해주세요.')});if(phone&&!/^[0-9-]+$/.test(phone))errors.push('올바른 전화번호 형식으로 입력해주세요 (예: 714-555-1234)');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))errors.push('올바른 이메일 주소를 입력해주세요.');['licenseNumber','bondNumber'].forEach(k=>{if(data[k].length>0&&data[k].length<3)errors.push('라이선스 번호를 확인해주세요.')});if(!data.bondAmount||Number(data.bondAmount)<=0)errors.push('0보다 큰 금액을 입력해주세요.');['licenseExpiry','bondExpiry'].forEach(k=>{if(data[k]&&data[k]<limits.min)warnings.push('이미 만료된 날짜입니다. 갱신된 라이선스/본드 정보를 입력해주세요.');if(data[k]&&data[k]>limits.max)errors.push('만료일은 오늘부터 10년 이내로 입력해주세요.')});msg.textContent=[...new Set(errors)].join(' ');warning.textContent=[...new Set(warnings)].join(' ');return errors.length?null:data}dateLimits();form.onsubmit=async e=>{e.preventDefault();let data=validate();if(!data)return;try{await api({action:'submitContractorApplication',data});form.classList.add('hidden');document.querySelector('#done').classList.remove('hidden')}catch(x){msg.textContent=x.message}};</script></body></html>
