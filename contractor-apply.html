<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린EV 협력업체 지원</title><script src="site-config.js"></script><style>body{font:16px system-ui,"Malgun Gothic";max-width:760px;margin:30px auto;padding:0 18px}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 13px}label{display:block;font-weight:bold}.hidden{display:none}.error{color:#b00}</style><body><h1>클린EV 협력업체 지원</h1><p>함께 고객의 전기차·충전기 지원을 도울 협력업체를 찾고 있습니다.</p><form id="form"><label>업체명 또는 이름<input name="name" required></label><label>연락처<input name="phone" required></label><label>이메일<input name="email" type="email" required></label><label>서비스 가능 지역<input name="serviceArea" placeholder="우편번호 또는 지역명" required></label><h2>라이선스 정보</h2><p>캘리포니아 계약자 면허(CSLB) 번호를 입력하세요.</p><label>라이선스 번호<input name="licenseNumber" required></label><label>라이선스 종류<input name="licenseType"></label><label>라이선스 만료일<input name="licenseExpiry" type="date" required></label><h2>본드 정보</h2><label>본드 회사명<input name="bondCompany"></label><label>본드 번호<input name="bondNumber" required></label><label>본드 보장금액<input name="bondAmount"></label><label>본드 만료일<input name="bondExpiry" type="date" required></label><label>경력 또는 한줄소개<textarea name="bio"></textarea></label><button>지원서 제출</button></form><section id="done" class="hidden"><h2>지원해주셔서 감사합니다.</h2><p>검토 후 이메일로 연락드리겠습니다.</p></section><p id="msg" class="error"></p><script>const CONFIG={brandName:SITE_CONFIG.brandName||'클린EV',apiUrl:SITE_CONFIG.apiUrl};document.querySelector('h1').textContent=CONFIG.brandName+' 협력업체 지원';async function api(data){if(!CONFIG.apiUrl||CONFIG.apiUrl==='PASTE_YOUR_APPS_SCRIPT_URL_HERE')throw Error('관리자가 아직 서버 설정을 완료하지 않았습니다');try{let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}),j=await r.json();if(!j.success)throw Error(j.error||'요청에 실패했습니다.');return j}catch(e){if(e instanceof TypeError||e.message==='Failed to fetch')throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요');throw e}}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await api({action:'submitContractorApplication',data:Object.fromEntries(new FormData(e.target))});e.target.classList.add('hidden');document.querySelector('#done').classList.remove('hidden')}catch(x){document.querySelector('#msg').textContent=x.message}};</script></body></html>
