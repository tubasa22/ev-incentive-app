<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린EV 협력업체 지원</title>

<script src="site-config.js"></script><style>body{font:16px system-ui,"Malgun Gothic";max-width:760px;margin:30px auto;padding:0 18px}.site-logo{display:flex;align-items:center;gap:8px;color:#0F5C4C;text-decoration:none}.site-logo:before{content:"";width:32px;height:32px;flex:0 0 32px;background-color:currentColor;-webkit-mask:url("assets/logo-icon.svg") center/contain no-repeat;mask:url("assets/logo-icon.svg") center/contain no-repeat}.site-logo-icon{display:none;width:32px;height:32px;color:#0F5C4C}.site-logo-text{font-family:"Pretendard",sans-serif;font-weight:700;font-size:22px;color:#0F5C4C}.header-dark .site-logo{color:#F7F6F1}.header-dark .site-logo-icon{color:#F7F6F1}.header-dark .site-logo-text{color:#F7F6F1}.site-logo{margin-bottom:18px}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 13px}label{display:block;font-weight:bold}.hidden{display:none}.error{color:#b00}
/* 공개 페이지 공통 네비게이션 */
.public-header-row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.public-header-row .site-logo{margin:0;flex-shrink:0}
.public-nav{display:flex;align-items:center;gap:18px}
.public-nav a{color:#0F5C4C;text-decoration:none;font:600 14px/1.5 Pretendard,sans-serif;padding:10px 0}
.public-nav a:hover,.public-nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:2px}
.public-nav a.public-nav-cta{background:#0F5C4C;color:#F7F6F1;padding:12px 16px;border-radius:8px;text-decoration:none}
.public-nav a.public-nav-cta:hover{background:#0B4438}
.public-nav-toggle{display:none;width:auto;margin:0;padding:8px 12px;border:1px solid currentColor;border-radius:6px;background:transparent;color:#0F5C4C;font:24px/1.2 sans-serif;cursor:pointer}
.header-dark .public-nav a:not(.public-nav-cta),.header-dark .public-nav-toggle{color:#F7F6F1}
.public-header-row a:focus-visible,.public-nav-toggle:focus-visible{outline:3px solid #E8A33D;outline-offset:4px}
@media(max-width:799px){
.public-header-row{gap:12px}
.public-nav{width:100%;flex-direction:column;align-items:stretch;gap:4px;padding:12px 0;border-top:1px solid #5C5A54}
.public-nav a{padding:12px}
.public-header-row.nav-ready .public-nav-toggle{display:block}
.public-header-row.nav-ready .public-nav{display:none}
.public-header-row.nav-ready.menu-open .public-nav{display:flex}
}
</style></head><body><header class="site-header"><div class="public-header-row"><a href="landing.html" class="site-logo"><img src="assets/logo-icon.svg" class="site-logo-icon" alt=""><span class="site-logo-text">클린EV</span></a><button type="button" class="public-nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="public-navigation">☰</button><nav id="public-navigation" class="public-nav" aria-label="주요 메뉴"><a href="about.html">서비스 소개</a><a href="contractor-apply.html" aria-current="page">협력업체 지원</a><a href="legal.html">법적고지</a><a href="index.html" class="public-nav-cta">무료 자격 확인</a></nav></div></header><h1>클린EV 협력업체 지원</h1><p>함께 고객의 전기차·충전기 지원을 도울 협력업체를 찾고 있습니다.</p><form id="form" novalidate><label>업체명 또는 이름<input name="name" placeholder="예: 김전기 일렉트릭" required></label><label>연락처<input name="phone" type="tel" inputmode="tel" pattern="[0-9-]+" placeholder="예: 714-555-1234" required></label><label>이메일<input name="email" type="email" placeholder="예: contact@example.com" required></label><label>서비스 가능 지역<input name="serviceArea" placeholder="예: 풀러턴, 애너하임, 부에나파크" required></label><h2>라이선스 정보</h2><p>캘리포니아 계약자 면허(CSLB) 번호를 입력하세요.</p><label>라이선스 번호<input name="licenseNumber" inputmode="numeric" pattern="[0-9]{3,}" placeholder="예: 1234567" required></label><label>라이선스 종류<input name="licenseType" placeholder="예: C-10 (전기)"></label><label>라이선스 만료일<input name="licenseExpiry" type="date" required></label><h2>본드 정보</h2><label>본드 회사명<input name="bondCompany" placeholder="예: Western Surety Company"></label><label>본드 번호<input name="bondNumber" placeholder="예: SB-123456" required></label><label>본드 보장금액<input name="bondAmount" type="number" min="0" step="1" placeholder="예: 15000"></label><label>본드 만료일<input name="bondExpiry" type="date" required></label><label>경력 또는 한줄소개<textarea name="bio" placeholder="예: 10년 경력의 주택용 전기 시공 전문업체입니다"></textarea></label><button>지원서 제출</button></form><section id="done" class="hidden"><h2>지원해주셔서 감사합니다.</h2><p>검토 후 이메일로 연락드리겠습니다.</p></section><p id="msg" class="error"></p><p id="warning"></p><script>const CONFIG={brandName:SITE_CONFIG.brandName||'클린EV',apiUrl:SITE_CONFIG.apiUrl};document.querySelector('h1').textContent=CONFIG.brandName+' 협력업체 지원';async function api(data){if(!CONFIG.apiUrl||CONFIG.apiUrl==='PASTE_YOUR_APPS_SCRIPT_URL_HERE')throw Error('관리자가 아직 서버 설정을 완료하지 않았습니다');try{let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}),j=await r.json();if(!j.success)throw Error(j.error||'요청에 실패했습니다.');return j}catch(e){if(e instanceof TypeError||e.message==='Failed to fetch')throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요');throw e}}const form=document.querySelector('#form'),msg=document.querySelector('#msg'),warning=document.querySelector('#warning');function dateLimits(){let today=new Date(),min=today.toISOString().slice(0,10),max=new Date(today.getFullYear()+10,today.getMonth(),today.getDate()).toISOString().slice(0,10);form.querySelectorAll('input[type=date]').forEach(x=>{x.min=min;x.max=max});return {min,max}}function validate(){let data=Object.fromEntries(new FormData(form)),errors=[],warnings=[],limits=dateLimits(),phone=String(data.phone||'').trim(),email=String(data.email||'').trim();['name','phone','email','serviceArea','licenseNumber','licenseExpiry','bondNumber','bondExpiry'].forEach(k=>{data[k]=String(data[k]||'').trim();if(!data[k])errors.push('필수 항목을 입력해주세요.')});if(phone&&!/^[0-9-]+$/.test(phone))errors.push('올바른 전화번호 형식으로 입력해주세요 (예: 714-555-1234)');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))errors.push('올바른 이메일 주소를 입력해주세요.');['licenseNumber','bondNumber'].forEach(k=>{if(data[k].length>0&&data[k].length<3)errors.push('라이선스 번호를 확인해주세요.')});if(!data.bondAmount||Number(data.bondAmount)<=0)errors.push('0보다 큰 금액을 입력해주세요.');['licenseExpiry','bondExpiry'].forEach(k=>{if(data[k]&&data[k]<limits.min)warnings.push('이미 만료된 날짜입니다. 갱신된 라이선스/본드 정보를 입력해주세요.');if(data[k]&&data[k]>limits.max)errors.push('만료일은 오늘부터 10년 이내로 입력해주세요.')});msg.textContent=[...new Set(errors)].join(' ');warning.textContent=[...new Set(warnings)].join(' ');return errors.length?null:data}dateLimits();form.onsubmit=async e=>{e.preventDefault();let data=validate();if(!data)return;try{let result=await api({action:'submitContractorApplication',data}),done=document.querySelector('#done');form.classList.add('hidden');done.classList.remove('hidden');done.innerHTML=result.applicantEmailSent?'<h2>지원해주셔서 감사합니다.</h2><p>확인 이메일을 보내드렸습니다. 검토 후 이메일 또는 전화로 연락드리겠습니다.</p>':'<h2>지원이 완료되었습니다.</h2><p>접수는 완료되었으나 확인 이메일 발송에는 실패했습니다. 지원번호를 저장해두세요: '+result.applicationId+'</p>';}catch(x){msg.textContent=x.message}}</script><script>
/* 모바일 메뉴: 기본 링크는 자바스크립트 없이도 사용 가능 */
(function(){
  const header=document.querySelector('.public-header-row');
  const button=header.querySelector('.public-nav-toggle');
  const menu=header.querySelector('.public-nav');
  function setOpen(open){
    header.classList.toggle('menu-open',open);
    button.setAttribute('aria-expanded',String(open));
    button.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
  }
  header.classList.add('nav-ready');
  button.addEventListener('click',()=>setOpen(button.getAttribute('aria-expanded')!=='true'));
  header.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&button.getAttribute('aria-expanded')==='true'){setOpen(false);button.focus();}
  });
  document.addEventListener('click',event=>{if(!header.contains(event.target))setOpen(false);});
  menu.addEventListener('click',event=>{if(event.target.closest('a'))setOpen(false);});
  window.matchMedia('(min-width:800px)').addEventListener('change',()=>setOpen(false));
})();
</script></body></html>
