<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>결제 및 접수 확인 | 클린EV</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#F7F6F1;color:#1C1B18;font:16px/1.7 Pretendard,sans-serif}
    header,main{max-width:760px;margin:auto;padding:24px}main{margin-top:32px}
    .site-logo{display:flex;align-items:center;gap:8px;color:#0F5C4C;text-decoration:none;font-size:22px;font-weight:700}
    .site-logo img{width:32px;height:32px}h1{font-size:26px;color:#0F5C4C}
    section{padding:24px;border:1px solid #5C5A54;border-radius:12px;overflow-wrap:anywhere}
    button{font:inherit;padding:12px 20px;border:0;border-radius:8px;background:#0F5C4C;color:#F7F6F1;cursor:pointer}
    button:hover{background:#0B4438}button:disabled{opacity:.6;cursor:wait}a{color:#0F5C4C}
    :focus-visible{outline:3px solid #E8A33D;outline-offset:4px}[hidden]{display:none}
  </style>
</head>
<body>
  <header><a href="landing.html" class="site-logo"><img src="assets/logo-icon.svg" alt=""><span>클린EV</span></a></header>
  <main><section aria-live="polite" aria-busy="true" id="paymentPanel">
    <h1 id="heading">결제를 확인하고 있습니다</h1>
    <p id="message">결제 정보 확인 후 신청이 자동으로 접수됩니다. 잠시만 기다려주세요.</p>
    <p id="paymentSummary" hidden></p>
    <button type="button" id="retry" hidden>결제 확인 다시 시도</button>
    <p>문의: <a id="contact"></a></p>
    <a href="landing.html">처음으로 돌아가기</a>
    <noscript><p>결제 확인을 위해 자바스크립트를 켜거나 관리자에게 문의해주세요.</p></noscript>
  </section></main>
  <script src="site-config.js"></script>
  <script>
    const params=new URLSearchParams(location.search);
    const sessionId=params.get('session_id')||'';
    const token=params.get('token')||params.get('client_reference_id')||'';
    const contact=document.querySelector('#contact'),retry=document.querySelector('#retry');
    contact.textContent=SITE_CONFIG.contactEmail;contact.href='mailto:'+SITE_CONFIG.contactEmail;
    let running=false;
    function display(title,message){document.querySelector('#heading').textContent=title;document.querySelector('#message').textContent=message;}
    async function verify(){
      if(running)return;
      running=true;retry.hidden=true;document.querySelector('#paymentPanel').setAttribute('aria-busy','true');
      const deadline=Date.now()+20000;
      try{
        if(!/^cs_(test_|live_)[A-Za-z0-9]+$/.test(sessionId))throw Error('결제 세션 정보가 없습니다. 결제 후 받은 접수 확인 링크를 다시 열거나 관리자에게 문의해주세요.');
        if(token&&!/^PAY-[a-f0-9]{32}$/.test(token))throw Error('신청 토큰이 올바르지 않습니다. 관리자에게 문의해주세요.');
        if(!SITE_CONFIG.apiUrl||SITE_CONFIG.apiUrl.startsWith('PASTE_'))throw Error('결제 시스템이 아직 설정되지 않았습니다. 관리자에게 문의해주세요.');
        display('결제를 확인하고 있습니다','결제 정보 확인 후 신청이 자동으로 접수됩니다. 잠시만 기다려주세요.');
        while(Date.now()<deadline){
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),Math.max(1,deadline-Date.now()));
          let result;
          try{
            const response=await fetch(SITE_CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'verifySession',sessionId,token}),signal:controller.signal});
            if(!response.ok)throw Error('서버 응답을 받지 못했습니다.');
            result=await response.json();
          }catch(error){
            if(Date.now()>=deadline)break;
            throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인한 후 다시 시도해주세요.');
          }finally{clearTimeout(timer);}
          if(result.success&&result.status==='완료'){
            const summary=document.querySelector('#paymentSummary'),payment=result.payment;
            summary.textContent=payment&&payment.name&&Number.isFinite(payment.amount)?'결제하신 서비스: '+payment.name+' ($'+payment.amount+')':'결제 유형·금액 기록은 관리자에게 문의해주세요.';
            summary.hidden=false;
            display('접수가 완료되었습니다!','확인 이메일을 보내드릴 예정입니다. 입력하신 정보를 검토한 후 영업일 기준 1~2일 내로 전화 또는 이메일로 연락드리겠습니다.');
            return;
          }
          if(!result.pending)throw Error(result.error||'결제를 확인하지 못했습니다. 다시 시도하거나 관리자에게 문의해주세요.');
          await new Promise(resolve=>setTimeout(resolve,Math.min(3000,Math.max(0,deadline-Date.now()))));
        }
        display('결제 확인 중입니다','아직 결제가 확인되지 않았습니다. 잠시 후 다시 시도하거나 관리자에게 문의해주세요. 확인되면 이메일로 안내드립니다.');
        retry.hidden=false;
      }catch(error){display('결제 확인이 필요합니다',error.message);retry.hidden=false;}
      finally{running=false;document.querySelector('#paymentPanel').setAttribute('aria-busy','false');}
    }
    retry.addEventListener('click',verify);
    verify();
  </script>
</body>
</html>
