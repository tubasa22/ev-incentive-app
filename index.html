<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EV 인센티브 자격확인</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#163040;font:15px system-ui,"Malgun Gothic",sans-serif}header{background:#12344d;color:white;padding:20px max(20px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center}h1,h2,h3,p{margin-top:0}main{max-width:1050px;margin:25px auto;padding:0 18px}.view,.step{display:none}.view.active,.step.active{display:block}.panel,.card{background:white;border:1px solid #d6e0e5;border-radius:12px;padding:23px;margin-bottom:16px}.tabs button{background:transparent;color:white}.tabs button.active{background:white;color:#12344d}.progress{display:flex;gap:4px;margin-bottom:25px}.progress i{height:7px;flex:1;background:#d6e0e5;border-radius:8px}.progress i.on{background:#1671ae}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.three{grid-template-columns:repeat(3,1fr)}label{font-weight:650}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #b7c6ce;border-radius:7px;font:inherit}textarea{min-height:65px}.actions{display:flex;justify-content:space-between;margin-top:24px}button{border:0;border-radius:7px;padding:9px 13px;background:#176ca5;color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e4edf1;color:#163040}.hidden{display:none!important}.help,.muted{color:#607482}.badge{background:#fff0bf;color:#735600;border-radius:15px;padding:3px 8px;font-size:12px;font-weight:bold}.programs,.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.program{border:1px solid #cbd8de;border-top:4px solid #15936c;border-radius:8px;padding:14px}.amount{font-size:21px;font-weight:bold;color:#08714d}.notice{border-left:4px solid #d4a000;background:#fff7dc;padding:12px}.search{display:flex;gap:8px}.search input{margin:0}.history{border-left:2px solid #cbd8de;padding-left:14px;margin-top:15px}.column{background:#e7eef2;border-radius:8px;padding:11px;min-height:120px}.tile{background:white;border-radius:6px;padding:9px;margin:7px 0}.error{color:#b42318;font-weight:bold}.success{color:#08714d;font-weight:bold}@media(max-width:600px){header{display:block}.tabs{margin-top:10px}.fields,.three{grid-template-columns:1fr}.search{flex-direction:column}}
</style></head><body><header><div><h1>EV 인센티브 자격확인</h1><small>캘리포니아 전기차·충전기 지원 프로그램 매칭</small></div><nav class="tabs"><button class="tab active" data-view="intake">새 자격 확인</button><button class="tab" data-view="cases">케이스 관리</button></nav></header><main>
<section id="intake" class="view active"><div class="panel"><div class="progress"><i class="on"></i><i></i><i></i><i></i><i></i></div><form id="form">
<div class="step active"><h2>신청자 기본정보</h2><div class="fields"><label>이름<input name="name" required></label><label>전화번호<input name="phone" type="tel" required></label><label>이메일<input name="email" type="email" required></label><label>우편번호<input name="zip" pattern="[0-9]{5}" maxlength="5" required></label><label>주택 소유 여부<select name="housing" required><option value="">선택</option><option>자가</option><option>렌트</option></select></label></div><div class="actions"><span></span><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>소득정보</h2><p class="help">소득은 브라우저에 저장하지 않으며, 케이스 저장 시 Google Sheets로만 전송됩니다.</p><div class="fields three"><label>가구원 수<input name="household" type="number" min="1" required></label><label>가구 총소득 / 신고소득($)<input name="income" type="number" min="0" required></label><label>신고 연도<select name="incomeYear"><option>2025</option><option>2024</option><option>2023</option></select></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>기존 차량</h2><div class="fields"><label>연식<input name="vehicleYear" type="number" min="1900" max="2027"></label><label>연료 타입<select name="fuel"><option value="">해당 없음</option><option value="gas">가솔린</option><option value="diesel">디젤</option><option value="hybrid">하이브리드</option><option value="ev">전기차</option></select></label><label>본인 명의 여부<select name="vehicleOwned"><option value="">해당 없음</option><option value="yes">예</option><option value="no">아니오</option></select></label><label>스모그 체크 통과 여부<select name="smog"><option value="">해당 없음</option><option value="yes">예</option><option value="no">아니오</option></select></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>희망사항</h2><div class="fields"><label>희망 지원<select name="purchaseType" required><option value="">선택</option><option value="new">신차</option><option value="used">인증중고차</option><option value="charger">충전기만</option></select></label><label>희망 차종<input name="desiredVehicle"></label><label>기존 EV 보유 여부<select name="hasEV" required><option value="">선택</option><option value="yes">예</option><option value="no">아니오</option></select></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>과거 신청 이력</h2><div class="fields"><label>과거 CVRP/RYR/CC4A/DCAP 신청 여부<select name="previousApplied"><option value="no">없음</option><option value="yes">있음</option></select></label><label>프로그램명 및 결과<input name="previousProgram" placeholder="예: RYR 승인"></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button>자격 확인</button></div></div></form></div><div id="results" class="hidden"></div></section>
<section id="cases" class="view"><div class="panel"><h2>케이스 이력 관리</h2><p class="help">CaseID 또는 전화번호로 검색합니다. 상태 변경은 새 이력으로만 추가됩니다.</p><div class="search"><input id="query" placeholder="CaseID 또는 전화번호"><button id="search">검색</button></div><p id="message"></p><div id="caseResults"></div><h2>상태별 파이프라인</h2><div id="kanban" class="kanban"></div></div></section></main>
<script>
// 금액·소득기준은 이 CONFIG에서만 수정합니다. 모든 결과는 공식 공고 확인 전 추정치입니다.
const CONFIG={apiUrl:'',fpl:{1:15650,2:21150,3:26650,4:32150,5:37650,6:43150,7:48650,8:54150,additional:5500},zipMap:{'900':['South Coast AQMD','LADWP'],'901':['South Coast AQMD','LADWP'],'902':['South Coast AQMD','SCE'],'903':['South Coast AQMD','SCE'],'904':['South Coast AQMD','SCE'],'905':['South Coast AQMD','SCE'],'906':['South Coast AQMD','SCE'],'907':['South Coast AQMD','SCE'],'908':['South Coast AQMD','SCE'],'910':['South Coast AQMD','SCE'],'911':['South Coast AQMD','SCE'],'912':['South Coast AQMD','SCE'],'913':['South Coast AQMD','SCE'],'914':['South Coast AQMD','SCE'],'915':['South Coast AQMD','SCE'],'916':['South Coast AQMD','SCE'],'917':['South Coast AQMD','SCE'],'918':['South Coast AQMD','SCE'],'919':['South Coast AQMD','SDG&E'],'920':['South Coast AQMD','SDG&E'],'921':['South Coast AQMD','SDG&E'],'922':['South Coast AQMD','SCE'],'923':['South Coast AQMD','SCE'],'924':['South Coast AQMD','SCE'],'925':['South Coast AQMD','SCE'],'926':['South Coast AQMD','SCE'],'927':['South Coast AQMD','SCE'],'928':['South Coast AQMD','SCE'],'930':['South Coast AQMD','SCE'],'940':['Bay Area AQMD','PG&E'],'941':['Bay Area AQMD','PG&E'],'942':['Bay Area AQMD','PG&E'],'943':['Bay Area AQMD','PG&E'],'944':['Bay Area AQMD','PG&E'],'945':['Bay Area AQMD','PG&E'],'946':['Bay Area AQMD','PG&E'],'947':['Bay Area AQMD','PG&E'],'948':['Bay Area AQMD','PG&E'],'949':['Bay Area AQMD','PG&E'],'950':['Monterey Bay APCD','PG&E'],'951':['Bay Area AQMD','PG&E'],'952':['San Joaquin Valley APCD','PG&E'],'953':['San Joaquin Valley APCD','PG&E'],'957':['Sacramento Metro AQMD','SMUD'],'958':['Sacramento Metro AQMD','SMUD']},programs:{RYR:{name:'Replace Your Ride',amount:12000,max:400,docs:['신분증 및 거주 증명','소득 증빙','차량 등록증','폐차/반납 서류']},CC4A:{name:'Clean Cars 4 All',amount:12000,max:400,docs:['소득 증빙','차량 등록증','스모그 검사 서류','거주 증명']},DCAP:{name:'Drive Clean Assistance Program',amount:7500,max:400,docs:['신분증','소득 증빙','운전면허증','구매 서류']},MyFirstEV:{name:'My First EV',amount:2000,max:300,docs:['소득 증빙','거주 증명','신차 구매/리스 서류']},CALeVIP:{name:'CALeVIP 충전기 리베이트',amount:6000,docs:['설치 주소','충전기 견적서','전기 패널 정보']},Utility:{name:'유틸리티 충전기 리베이트',amount:1000,docs:['전기요금 고지서','충전기 영수증']}}};
const statusList=['대기','서류접수','제출','승인','거절','정산완료'];let step=0,data,lastCases=[];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fplPercent(income,household){return Math.round(Number(income)/(CONFIG.fpl[Math.min(household,8)]+Math.max(0,household-8)*CONFIG.fpl.additional)*100)}function zipInfo(zip){let x=CONFIG.zipMap[String(zip).slice(0,3)];return {district:x?x[0]:'확인 필요',utility:x?x[1]:'확인 필요'}}function eligible(id,d,c){let p=CONFIG.programs[id],old=+d.vehicleYear>0&&d.vehicleOwned==='yes'&&d.fuel!=='ev',ok=false,reason='';if(id==='RYR'||id==='CC4A'){ok=c.zip.district==='South Coast AQMD'&&c.fpl<=p.max&&old&&d.smog==='yes';reason=ok?'지역, 소득 및 기존 차량 조건에 부합합니다.':'South Coast AQMD 지역·400% FPL 이하·본인 명의 스모그 통과 내연기관 차량을 확인해야 합니다.'}else if(id==='DCAP'){ok=c.fpl<=p.max&&d.purchaseType!=='charger';reason=ok?'소득 및 차량 구매 지원 기본 조건에 부합합니다.':'400% FPL 이하와 차량 구매 희망 여부를 확인해야 합니다.'}else if(id==='MyFirstEV'){ok=c.fpl<=p.max&&d.hasEV==='no'&&d.purchaseType==='new';reason=ok?'첫 EV 구매 기본 조건에 부합합니다.':'300% FPL 이하, 기존 EV 미보유, 신차 구매 조건을 확인해야 합니다.'}else if(id==='CALeVIP'){ok=d.purchaseType==='charger';reason=ok?'충전기 설치 희망으로 지역 공고 확인 대상입니다.':'충전기만 지원을 선택한 경우에 해당합니다.'}else{ok=d.purchaseType==='charger'&&c.zip.utility!=='확인 필요';reason=ok?`${c.zip.utility} 관할로 추정됩니다.`:'충전기 지원 및 유틸리티 관할을 확인해야 합니다.'}return {...p,id,ok,reason}}function matchPrograms(d){let context={fpl:fplPercent(d.income,d.household),zip:zipInfo(d.zip)};return {context,results:Object.keys(CONFIG.programs).map(id=>eligible(id,d,context)).filter(x=>x.ok).sort((a,b)=>b.amount-a.amount)}}window.EVRuleEngine={fplPercent,zipInfo,eligible,matchPrograms};
function show(n){step=n;$$('.step').forEach((x,i)=>x.classList.toggle('active',i===i&&i===n));$$('.progress i').forEach((x,i)=>x.classList.toggle('on',i<=n))}function valid(){let bad=$$('.step')[step].querySelector(':invalid');if(bad){bad.reportValidity();return false}return true}$$('[data-next]').forEach(b=>b.onclick=()=>valid()&&show(step+1));$$('[data-prev]').forEach(b=>b.onclick=()=>show(step-1));
$('#form').onsubmit=e=>{e.preventDefault();if(!valid())return;data=Object.fromEntries(new FormData(e.target));let m=matchPrograms(data),cards=m.results.map(p=>`<article class="program"><h3>${p.name}</h3><div class="amount">최대 $${p.amount.toLocaleString()}</div><p>${p.reason}</p><b>필요 서류</b><ul>${p.docs.map(d=>`<li>${d}</li>`).join('')}</ul></article>`).join('')||'<p>자동 매칭 결과가 없습니다. 담당자가 세부 조건을 확인해 주세요.</p>';$('#results').innerHTML=`<div class="panel"><h2>매칭 결과</h2><p><span class="badge">추정치 — 확인 필요</span> ZIP: ${m.context.zip.district} / ${m.context.zip.utility} · 소득 ${m.context.fpl}% FPL</p>${m.results.filter(x=>x.id==='RYR'||x.id==='CC4A').length>1?'<p class="notice">RYR와 Clean Cars 4 All은 지원 성격이 겹칠 수 있습니다. 중복 수혜 가능 여부를 확인하세요.</p>':''}<div class="programs">${cards}</div><button id="save">이 케이스 저장</button><p id="saveMsg"></p></div>`;$('#results').classList.remove('hidden');$('#results').scrollIntoView({behavior:'smooth'});$('#save').onclick=save};
async function post(o){if(!CONFIG.apiUrl)throw Error('Apps Script 웹앱 URL을 CONFIG.apiUrl에 설정하세요.');let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}),j=await r.json();if(!j.success)throw Error(j.error||'처리에 실패했습니다.');return j}async function save(){let b=$('#save'),m=$('#saveMsg');b.disabled=true;m.textContent='저장 중…';try{let r=await post({action:'createCase',applicant:data,programs:matchPrograms(data).results});m.className='success';m.textContent=`저장되었습니다. CaseID: ${r.caseId}`;b.textContent='저장 완료'}catch(e){m.className='error';m.textContent=e.message;b.disabled=false}}
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab,.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.view).classList.add('active');renderKanban(lastCases)});$('#search').onclick=search;$('#query').onkeydown=e=>e.key==='Enter'&&search();async function search(){let q=$('#query').value.trim();if(!q)return;$('#message').textContent='검색 중…';try{if(!CONFIG.apiUrl)throw Error('Apps Script 웹앱 URL을 CONFIG.apiUrl에 설정하세요.');let j=await(await fetch(CONFIG.apiUrl+'?query='+encodeURIComponent(q))).json();if(!j.success)throw Error(j.error);lastCases=j.cases;$('#message').textContent=`${lastCases.length}건을 찾았습니다.`;renderCases();renderKanban(lastCases)}catch(e){$('#message').className='error';$('#message').textContent=e.message}}function renderCases(){$('#caseResults').innerHTML=lastCases.map(c=>`<article class="card"><h3>${esc(c.caseId)} <span class="badge">${esc(c.status)}</span></h3><p>${esc(c.applicant.name)} · ${esc(c.applicant.phone)} · ${esc(c.createdAt)}</p><label>상태 변경<select class="state" data-id="${esc(c.caseId)}">${statusList.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></label><label>변경 메모<textarea class="note" data-id="${esc(c.caseId)}"></textarea></label><button class="update" data-id="${esc(c.caseId)}">상태 저장</button><div class="history"><b>상태 이력</b>${(c.history||[]).map(h=>`<p>${esc(h.timestamp)} — ${esc(h.previousStatus||'신규')} → ${esc(h.newStatus)} ${esc(h.note||'')}</p>`).join('')}</div></article>`).join('');$$('.update').forEach(b=>b.onclick=async()=>{let id=b.dataset.id;try{await post({action:'updateStatus',caseId:id,newStatus:$(`.state[data-id="${id}"]`).value,note:$(`.note[data-id="${id}"]`).value,agent:'담당자'});search()}catch(e){$('#message').className='error';$('#message').textContent=e.message}})}function renderKanban(cases){$('#kanban').innerHTML=statusList.map(s=>`<div class="column"><b>${s} (${cases.filter(c=>c.status===s).length})</b>${cases.filter(c=>c.status===s).map(c=>`<div class="tile"><b>${esc(c.caseId)}</b><br>${esc(c.applicant.name)}</div>`).join('')}</div>`).join('')}
</script></body></html>
