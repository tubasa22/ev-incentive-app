<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EV 인센티브 자격확인</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#163040;font:15px system-ui,"Malgun Gothic",sans-serif}header{background:#12344d;color:white;padding:20px max(20px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center}h1,h2,h3,p{margin-top:0}main{max-width:1050px;margin:25px auto;padding:0 18px}.step{display:none}.step.active{display:block}.panel,.card{background:white;border:1px solid #d6e0e5;border-radius:12px;padding:23px;margin-bottom:16px}.progress{display:flex;gap:4px;margin-bottom:25px}.progress i{height:7px;flex:1;background:#d6e0e5;border-radius:8px}.progress i.on{background:#1671ae}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.three{grid-template-columns:repeat(3,1fr)}label{font-weight:650}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #b7c6ce;border-radius:7px;font:inherit}textarea{min-height:65px}.actions{display:flex;justify-content:space-between;margin-top:24px}button{border:0;border-radius:7px;padding:9px 13px;background:#176ca5;color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e4edf1;color:#163040}.hidden{display:none!important}.help,.muted{color:#607482}.badge{background:#fff0bf;color:#735600;border-radius:15px;padding:3px 8px;font-size:12px;font-weight:bold}.error{color:#b42318;font-weight:bold}.success{color:#08714d;font-weight:bold}@media(max-width:600px){header{display:block}.fields,.three{grid-template-columns:1fr}}
</style></head><body><header><div><h1>EV 인센티브 자격확인</h1><small>캘리포니아 전기차·충전기 지원 프로그램 매칭</small></div></header><main>
<section id="intake"><div class="panel"><div class="progress"><i class="on"></i><i></i><i></i><i></i><i></i></div><form id="form">
<div class="step active"><h2>신청자 기본정보</h2><p class="help">검토 후 연락드릴 수 있도록 전화번호와 이메일을 모두 입력해 주세요.</p><div class="fields"><label>이름<input name="name" required></label><label>전화번호<input name="phone" type="tel" required></label><label>이메일<input name="email" type="email" required></label><label>연락 선호 방법<select name="contactPreference" required><option value="">선택</option><option value="전화">전화</option><option value="이메일">이메일</option><option value="문자">문자</option></select></label><label>우편번호<input name="zip" pattern="[0-9]{5}" maxlength="5" required></label><label>주택 소유 여부<select name="housing" required><option value="">선택</option><option>자가</option><option>렌트</option></select></label></div><div class="actions"><span></span><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>소득정보</h2><p class="help">소득은 브라우저에 저장하지 않으며, 케이스 저장 시 Google Sheets로만 전송됩니다.</p><div class="fields three"><label>가구원 수<input name="household" type="number" min="1" required></label><label>가구 총소득 / 신고소득($)<input name="income" type="number" min="0" required></label><label>신고 연도<select name="incomeYear"><option>2025</option><option>2024</option><option>2023</option></select></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>기존 차량</h2><div class="fields"><label>연식<input name="vehicleYear" type="number" min="1900" max="2027"></label><label>연료 타입<select name="fuel"><option value="">해당 없음</option><option value="gas">가솔린</option><option value="diesel">디젤</option><option value="hybrid">하이브리드</option><option value="ev">전기차</option></select></label><label>본인 명의 여부<select name="vehicleOwned"><option value="">해당 없음</option><option value="yes">예</option><option value="no">아니오</option></select></label><label>스모그 체크 통과 여부<select name="smog"><option value="">해당 없음</option><option value="yes">예</option><option value="no">아니오</option></select></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>희망사항</h2><div class="fields"><label>희망 지원<select name="purchaseType" required><option value="">선택</option><option value="new">신차</option><option value="used">인증중고차</option><option value="charger">충전기만</option></select></label><label>희망 차종<input name="desiredVehicle"></label><label>기존 EV 보유 여부<select name="hasEV" required><option value="">선택</option><option value="yes">예</option><option value="no">아니오</option></select></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button type="button" data-next>다음</button></div></div>
<div class="step"><h2>과거 신청 이력</h2><div class="fields"><label>과거 CVRP/RYR/CC4A/DCAP 신청 여부<select name="previousApplied"><option value="no">없음</option><option value="yes">있음</option></select></label><label>프로그램명 및 결과<input name="previousProgram" placeholder="예: RYR 승인"></label></div><div class="actions"><button type="button" class="secondary" data-prev>이전</button><button>자격 확인</button></div></div></form></div><div id="results" class="hidden"></div></section>
</main>
<!-- site-config.js의 apiUrl을 실제 배포 URL로 채워야 동작함. GitHub Pages 등 웹서버에서 테스트하세요. --><script src="site-config.js"></script><script>
// 금액·소득기준은 이 CONFIG에서만 수정합니다. 모든 결과는 공식 공고 확인 전 추정치입니다.
const CONFIG={apiUrl:SITE_CONFIG.apiUrl,fpl:{1:15650,2:21150,3:26650,4:32150,5:37650,6:43150,7:48650,8:54150,additional:5500},zipMap:{'900':['South Coast AQMD','LADWP'],'901':['South Coast AQMD','LADWP'],'902':['South Coast AQMD','SCE'],'903':['South Coast AQMD','SCE'],'904':['South Coast AQMD','SCE'],'905':['South Coast AQMD','SCE'],'906':['South Coast AQMD','SCE'],'907':['South Coast AQMD','SCE'],'908':['South Coast AQMD','SCE'],'910':['South Coast AQMD','SCE'],'911':['South Coast AQMD','SCE'],'912':['South Coast AQMD','SCE'],'913':['South Coast AQMD','SCE'],'914':['South Coast AQMD','SCE'],'915':['South Coast AQMD','SCE'],'916':['South Coast AQMD','SCE'],'917':['South Coast AQMD','SCE'],'918':['South Coast AQMD','SCE'],'919':['South Coast AQMD','SDG&E'],'920':['South Coast AQMD','SDG&E'],'921':['South Coast AQMD','SDG&E'],'922':['South Coast AQMD','SCE'],'923':['South Coast AQMD','SCE'],'924':['South Coast AQMD','SCE'],'925':['South Coast AQMD','SCE'],'926':['South Coast AQMD','SCE'],'927':['South Coast AQMD','SCE'],'928':['South Coast AQMD','SCE'],'930':['South Coast AQMD','SCE'],'940':['Bay Area AQMD','PG&E'],'941':['Bay Area AQMD','PG&E'],'942':['Bay Area AQMD','PG&E'],'943':['Bay Area AQMD','PG&E'],'944':['Bay Area AQMD','PG&E'],'945':['Bay Area AQMD','PG&E'],'946':['Bay Area AQMD','PG&E'],'947':['Bay Area AQMD','PG&E'],'948':['Bay Area AQMD','PG&E'],'949':['Bay Area AQMD','PG&E'],'950':['Monterey Bay APCD','PG&E'],'951':['Bay Area AQMD','PG&E'],'952':['San Joaquin Valley APCD','PG&E'],'953':['San Joaquin Valley APCD','PG&E'],'957':['Sacramento Metro AQMD','SMUD'],'958':['Sacramento Metro AQMD','SMUD']},programs:{RYR:{name:'Replace Your Ride',amount:12000,max:400,docs:['신분증 및 거주 증명','소득 증빙','차량 등록증','폐차/반납 서류']},CC4A:{name:'Clean Cars 4 All',amount:12000,max:400,docs:['소득 증빙','차량 등록증','스모그 검사 서류','거주 증명']},DCAP:{name:'Drive Clean Assistance Program',amount:7500,max:400,docs:['신분증','소득 증빙','운전면허증','구매 서류']},MyFirstEV:{name:'My First EV',amount:2000,max:300,docs:['소득 증빙','거주 증명','신차 구매/리스 서류']},CALeVIP:{name:'CALeVIP 충전기 리베이트',amount:6000,docs:['설치 주소','충전기 견적서','전기 패널 정보']},Utility:{name:'유틸리티 충전기 리베이트',amount:1000,docs:['전기요금 고지서','충전기 영수증']}}};
let step=0,data;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let liveProgramStatuses={RYR:'예',CC4A:'예',DCAP:'예',MyFirstEV:'예',CALeVIP:'예',유틸리티리베이트:'예'};const PROGRAM_STATUS_KEYS={RYR:'RYR',CC4A:'CC4A',DCAP:'DCAP',MyFirstEV:'MyFirstEV',CALeVIP:'CALeVIP',Utility:'유틸리티리베이트'};async function loadProgramStatuses(){try{let r=await fetch(CONFIG.apiUrl+'?query=programStatus'),j=await r.json();if(j.success&&j.statuses)liveProgramStatuses=j.statuses;}catch(e){console.warn('프로그램 운영 상태를 불러오지 못해 기본 활성 상태로 진행합니다.')}}const programStatusReady=loadProgramStatuses();function fplPercent(income,household){return Math.round(Number(income)/(CONFIG.fpl[Math.min(household,8)]+Math.max(0,household-8)*CONFIG.fpl.additional)*100)}function zipInfo(zip){let x=CONFIG.zipMap[String(zip).slice(0,3)];return {district:x?x[0]:'확인 필요',utility:x?x[1]:'확인 필요'}}function eligible(id,d,c){let p=CONFIG.programs[id],old=+d.vehicleYear>0&&d.vehicleOwned==='yes'&&d.fuel!=='ev',ok=false,reason='';if(id==='RYR'||id==='CC4A'){ok=c.zip.district==='South Coast AQMD'&&c.fpl<=p.max&&old&&d.smog==='yes';reason=ok?'지역, 소득 및 기존 차량 조건에 부합합니다.':'South Coast AQMD 지역·400% FPL 이하·본인 명의 스모그 통과 내연기관 차량을 확인해야 합니다.'}else if(id==='DCAP'){ok=c.fpl<=p.max&&d.purchaseType!=='charger';reason=ok?'소득 및 차량 구매 지원 기본 조건에 부합합니다.':'400% FPL 이하와 차량 구매 희망 여부를 확인해야 합니다.'}else if(id==='MyFirstEV'){ok=c.fpl<=p.max&&d.hasEV==='no'&&d.purchaseType==='new';reason=ok?'첫 EV 구매 기본 조건에 부합합니다.':'300% FPL 이하, 기존 EV 미보유, 신차 구매 조건을 확인해야 합니다.'}else if(id==='CALeVIP'){ok=d.purchaseType==='charger';reason=ok?'충전기 설치 희망으로 지역 공고 확인 대상입니다.':'충전기만 지원을 선택한 경우에 해당합니다.'}else{ok=d.purchaseType==='charger'&&c.zip.utility!=='확인 필요';reason=ok?`${c.zip.utility} 관할로 추정됩니다.`:'충전기 지원 및 유틸리티 관할을 확인해야 합니다.'}return {...p,id,ok,reason,isActive:liveProgramStatuses[PROGRAM_STATUS_KEYS[id]]!=='아니오'}}function matchPrograms(d){let context={fpl:fplPercent(d.income,d.household),zip:zipInfo(d.zip)};return {context,results:Object.keys(CONFIG.programs).map(id=>eligible(id,d,context)).filter(x=>x.ok).sort((a,b)=>b.amount-a.amount)}}window.EVRuleEngine={fplPercent,zipInfo,eligible,matchPrograms};
function show(n){step=n;$$('.step').forEach((x,i)=>x.classList.toggle('active',i===i&&i===n));$$('.progress i').forEach((x,i)=>x.classList.toggle('on',i<=n))}function valid(){let bad=$$('.step')[step].querySelector(':invalid');if(bad){bad.reportValidity();return false}return true}$$('[data-next]').forEach(b=>b.onclick=()=>valid()&&show(step+1));$$('[data-prev]').forEach(b=>b.onclick=()=>show(step-1));
$('#form').onsubmit=async e=>{e.preventDefault();if(!valid())return;data=Object.fromEntries(new FormData(e.target));if(!data.phone||!data.email){alert('전화번호와 이메일을 모두 입력해 주세요.');return;}await programStatusReady;let matching=matchPrograms(data),results=$('#results');try{let r=await post({action:'createCase',applicant:data,contactPreference:data.contactPreference,programs:matching.results,matchingResult:matching});e.target.closest('.panel').classList.add('hidden');results.innerHTML=`<div class="panel"><h2>접수가 완료되었습니다</h2><p>입력하신 정보를 검토한 후, 영업일 기준 1~2일 내로 전화 또는 이메일로 연락드리겠습니다.</p><p class="muted">문의가 있으시면 안내된 연락처로 연락해 주세요.</p></div>`;results.classList.remove('hidden');results.scrollIntoView({behavior:'smooth'});}catch(err){results.innerHTML=`<div class="panel"><p class="error">${esc(err.message)}</p></div>`;results.classList.remove('hidden');}};
async function post(o){if(!CONFIG.apiUrl)throw Error('Apps Script 웹앱 URL을 CONFIG.apiUrl에 설정하세요.');let r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}),j=await r.json();if(!j.success)throw Error(j.error||'처리에 실패했습니다.');return j}
/* 공통 API 연결: site-config.js의 apiUrl을 설정한 웹서버 환경에서만 동작합니다. */
const __cleanEvFetch=window.fetch.bind(window);window.fetch=async function(){if(!window.SITE_CONFIG||SITE_CONFIG.apiUrl==='PASTE_YOUR_APPS_SCRIPT_URL_HERE'||!SITE_CONFIG.apiUrl)throw Error('관리자가 아직 서버 설정을 완료하지 않았습니다');try{return await __cleanEvFetch.apply(null,arguments)}catch(e){throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요')}};CONFIG.apiUrl=SITE_CONFIG.apiUrl;
</script><footer style="text-align:center;padding:22px;color:#617483;font-size:13px"><a href="about.html">서비스 소개</a> · <a href="legal.html">법적고지 및 개인정보처리방침</a></footer></body></html>
