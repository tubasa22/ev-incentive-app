<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클린EV 페이스북 커버</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1640px; height: 624px; margin: 0; overflow: hidden; }
    body { font-family: Pretendard, "Noto Sans KR", sans-serif; color: #F7F6F1; }
    .canvas { position: relative; width: 100%; height: 100%; background: #0F5C4C url("../../assets/clean-ev-hero.png") center 46% / cover no-repeat; }
    .overlay { position: absolute; inset: 0; background: linear-gradient(90deg, #0F5C4C 0%, #0F5C4C 25%, rgba(15,92,76,.84) 48%, rgba(15,92,76,0) 100%); }
    .content { position: absolute; left: 170px; top: 125px; width: 1050px; height: 374px; display: flex; flex-direction: column; justify-content: center; }
    .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
    .logo { width: 68px; height: 68px; flex: 0 0 auto; background: #F7F6F1; mask: url("../../assets/logo-icon.svg") center / contain no-repeat; -webkit-mask: url("../../assets/logo-icon.svg") center / contain no-repeat; }
    .name { font-size: 44px; font-weight: 800; letter-spacing: -2px; }
    h1 { width: 980px; margin: 0; font-size: 54px; line-height: 1.22; font-weight: 800; letter-spacing: -2.6px; text-wrap: balance; }
    .region { margin-top: 22px; color: #E8A33D; font-size: 27px; line-height: 1.3; font-weight: 700; letter-spacing: .4px; }
    .notice { position: absolute; left: 170px; bottom: 45px; margin: 0; font-size: 18px; line-height: 1.4; font-weight: 500; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="overlay"></div>
    <section class="content">
      <div class="brand"><div class="logo" role="img" aria-label="클린EV 로고 아이콘"></div><div class="name">클린EV</div></div>
      <h1>전기차·충전기 지원, 우리 집도 가능한지 먼저 확인하세요</h1>
      <div class="region">LA · 오렌지카운티 · 사우스베이</div>
    </section>
    <p class="notice">정부 공식 기관이 아닌 신청 안내 서비스입니다</p>
  </main>
</body>
</html>
