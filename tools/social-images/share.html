<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클린EV 링크 공유 이미지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { font-family: Pretendard, "Noto Sans KR", sans-serif; color: #F7F6F1; }
    .canvas { position: relative; width: 100%; height: 100%; background: #0F5C4C url("../../assets/clean-ev-hero.png") center 45% / cover no-repeat; }
    .overlay { position: absolute; inset: 0; background: linear-gradient(90deg, #0F5C4C 0%, rgba(15,92,76,.96) 32%, rgba(15,92,76,.68) 60%, rgba(15,92,76,.12) 100%); }
    .content { position: absolute; inset: 0; padding: 120px 110px; display: flex; flex-direction: column; justify-content: center; }
    .brand { display: flex; align-items: center; gap: 26px; }
    .logo { width: 116px; height: 116px; flex: 0 0 auto; background: #F7F6F1; mask: url("../../assets/logo-icon.svg") center / contain no-repeat; -webkit-mask: url("../../assets/logo-icon.svg") center / contain no-repeat; }
    .name { font-size: 82px; line-height: 1; font-weight: 800; letter-spacing: -4px; }
    .tagline { margin-top: 40px; max-width: 760px; font-size: 44px; line-height: 1.28; font-weight: 700; letter-spacing: -2px; }
    .accent { width: 120px; height: 8px; margin-top: 34px; border-radius: 8px; background: #E8A33D; }
  </style>
</head>
<body>
  <main class="canvas"><div class="overlay"></div><section class="content"><div class="brand"><div class="logo" role="img" aria-label="클린EV 로고 아이콘"></div><div class="name">클린EV</div></div><div class="tagline">전기차·충전기 지원 신청 안내</div><div class="accent"></div></section></main>
</body>
</html>
