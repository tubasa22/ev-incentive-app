<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클린EV 페이스북 프로필</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1000px; height: 1000px; margin: 0; overflow: hidden; }
    body { background: #0F5C4C; color: #F7F6F1; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    .canvas { width: 100%; height: 100%; display: grid; place-items: center; }
    .safe { width: 700px; height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 54px; }
    .logo { width: 350px; height: 350px; background: #F7F6F1; mask: url("../../assets/logo-icon.svg") center / contain no-repeat; -webkit-mask: url("../../assets/logo-icon.svg") center / contain no-repeat; }
    .name { font-size: 112px; line-height: 1; font-weight: 800; letter-spacing: -5px; }
  </style>
</head>
<body>
  <main class="canvas"><div class="safe"><div class="logo" role="img" aria-label="클린EV 로고 아이콘"></div><div class="name">클린EV</div></div></main>
</body>
</html>
